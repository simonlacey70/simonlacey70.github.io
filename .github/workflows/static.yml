name: Publish website preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Unpack public website
        run: |
          mkdir -p public
          for archive in site-*.zip; do unzip -oq "$archive" -d public; done
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Publish preview
        id: deployment
        uses: actions/deploy-pages@v4
